# Dependabot — KOTIZ
# Cross-référence : Story 1.1 AC5 + DoD per_sprint dependabot_alerts_zero_critical
# Slack : alertes critiques routées vers #kotiz-security (config Story 1.2)

version: 2
updates:
  # ----- npm / pnpm (mobile RN/Expo, admin-web Next, packages, root) -----
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Africa/Abidjan"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      expo-related:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "@expo-google-fonts/*"
      react-native-ecosystem:
        patterns:
          - "react-native"
          - "react-native-*"
          - "@react-native/*"
      next-tooling:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
      typescript-tooling:
        patterns:
          - "typescript"
          - "@typescript-eslint/*"
          - "ts-*"
          - "tslib"
    # Les versions de ces paquets sont imposées par le SDK Expo : on les monte
    # d'un bloc avec `npx expo install --fix` lors d'une montée de SDK, jamais
    # paquet par paquet. Seuls les correctifs (patch) passent par Dependabot.
    ignore:
      - dependency-name: "expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "babel-preset-expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "eslint-config-expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # NativeWind 4 exige Tailwind 3 ; NativeWind 5 (Tailwind 4) n'est qu'en RC.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "nativewind"
        update-types: ["version-update:semver-major"]
      # babel-preset-expo dépend encore des plugins Babel 7.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      # Suit la version majeure de Node fixée dans .nvmrc.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # ----- Maven (backend Spring Boot) -----
  - package-ecosystem: "maven"
    directory: "/apps/backend"
    target-branch: "develop"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Africa/Abidjan"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # ----- GitHub Actions -----
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Abidjan"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"

  # ----- Docker (infra) -----
  - package-ecosystem: "docker"
    directory: "/infra/docker"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Abidjan"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
